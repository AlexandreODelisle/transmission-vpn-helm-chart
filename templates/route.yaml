---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.serviceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway
      sectionName: http
  hostnames:
    - {{ .Values.serviceName }}.adelisle.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.serviceName }}
          port: 80